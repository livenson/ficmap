name: Deploy to GitHub Pages

# Builds the Vite site and publishes dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

on:
  # Validate every PR (build only), and deploy on push to the default branch.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Scope concurrency per ref so a push-to-main run doesn't cancel an unrelated
# PR validation run (which showed up as spurious "cancelled" checks). A newer
# run for the SAME ref still supersedes the older one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Playwright is only used for local smoke tests; don't fetch browsers in CI.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The fast, deterministic half of this project's verification: every
      # marker on land, every place with a route to it, every bass note under
      # its melody, the terrain's detail plan and its seams, and the elevation
      # scales that let detail tiles agree with the map they refine. Twenty-odd
      # checks in about twenty seconds, so they run on every push. The
      # Playwright suite is the other half and is far too slow for this.
      - name: Sanity checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only publish from the default branch — never from PRs / feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
